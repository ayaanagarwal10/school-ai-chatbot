<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKSEC AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-wrapper">

    <div class="chat-header">
        <img src="/static/logo.png" alt="LKSEC Logo" class="logo">
        <div class="header-text">
            <h1>LKSEC Assistant</h1>
            <p>L K Singhania Education Centre · Gotan</p>
        </div>
        <div class="header-status">
            <span class="status-dot"></span>
            <span>Online</span>
        </div>
    </div>

    <div id="chat-box">
        <div class="message assistant">
            <div class="message-bubble">
                Welcome to LKSEC! I can help you with admissions, academics, boarding, facilities, fees, and more. How can I assist you today?
            </div>
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Ask about admissions, fees, boarding..."
            autocomplete="off"
        >
        <button id="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

    <div class="chat-footer">
        Official AI Assistant · L K Singhania Education Centre
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
